[project]
name = "statistikbanken-mcp"
version = "0.1.0"
description = "MCP server for Danmarks Statistik's Statistikbanken API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=2,<3",
]

[project.scripts]
statistikbanken-mcp = "statistikbanken_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Statistikbanken API (run with pytest -m live)",
]
